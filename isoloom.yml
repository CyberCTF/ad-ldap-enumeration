# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# LDAP / BloodHound enumeration as a single-container Isoloom lab: one Samba Active Directory
# Domain Controller for BRIGHTWELL.LAB (Brightwell University), no Windows VMs. It provisions
# a foothold user (s.adeyemi, a student), a service account (svc-moodle, the Moodle LMS sync
# account) whose LDAP `description` leaks its own password, and a nested group chain
# (svc-moodle -> "IT-Staff" -> "Registry-Admins") that is the only path to a registry share
# holding the flag. The student binds with the foothold creds, enumerates the directory
# (ldapsearch / nxc ldap / BloodHound), reads the leaked credential, follows the nested group
# path, and loots the flag. `isoloom generate`, then `isothrum up . --target docker`.
version: 1

name: ldap-enum-brightwell

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.40.10.0/24, internet: false }

machines:
  dc:
    networks: { lab: 10 }
    aliases: [dc.brightwell.lab, brightwell.lab]
    resources: { cpus: 2, memory_mb: 2048 }
    ports:
      dns:         { port: 53,   protocol: tcp }
      dns-udp:     { port: 53,   protocol: udp }
      kerberos:    { port: 88,   protocol: tcp }
      kerberos-udp: { port: 88,  protocol: udp }
      ldap:        { port: 389,  protocol: tcp }
      smb:         { port: 445,  protocol: tcp }
      kpasswd:     { port: 464,  protocol: tcp }
      kpasswd-udp: { port: 464,  protocol: udp }
      ldaps:       { port: 636,  protocol: tls }
      gc:          { port: 3268, protocol: tcp }
    # The flag arrives as a file before the DC starts (Isoloom's sensitive-input mechanism);
    # provisioning copies it into the registry share that only "Registry-Admins" may read.
    files:
      - { path: /ctf/flag, input: CTF_FLAG_MAIN, mode: "0444" }
    # A pre-built image (published to Docker Hub by .github/workflows/image.yml) beside the
    # local build: the launcher pulls the published image when it can and only builds build/dc
    # when it cannot, so a student skips the ~10-minute Samba + hashcat build. If Docker Hub is
    # unreachable or the image is missing, the lab still comes up by building locally. The tag is
    # the Compose service name (`dc`), matching the publishing action's tag-per-service scheme.
    app:
      image: cyberctf/ad-ldap-enumeration:dc
      build: build/dc

checks:
  - { name: the KDC answers, tcp: dc:88, wait: 120 }
  - { name: LDAP answers, tcp: dc:389, wait: 120 }
  - { name: SMB answers, tcp: dc:445, wait: 120 }
  # End-to-end LDAP enumeration, driven from inside the DC: s.adeyemi binds over a plain LDAP
  # simple bind, reads svc-moodle's leaked password out of its `description`, confirms the nested
  # group path to "Registry-Admins", and uses that password to read the flag from the registry
  # share. Passes only when the directory is genuinely enumerable this way; gated behind the ports.
  - name: LDAP enumeration recovers svc-moodle's password and unlocks the flag
    from: dc
    exec: /opt/ldapenum/check.sh
    expect: LDAP_ENUM_OK
    wait: 180

message: |
  # LDAP / BloodHound enumeration — Brightwell University (BRIGHTWELL.LAB)

  **Brightwell University** runs a lone Active Directory Domain Controller (Samba) for the realm
  **BRIGHTWELL.LAB**:

  - **DC:** `dc.brightwell.lab` at `{{ machines.dc.addresses.lab }}` (LDAP 389, SMB 445, KDC 88).
  - **Your foothold (a student's domain account):** `s.adeyemi` / `Student!2024`

  **Objective:** any authenticated user can read most of Active Directory over LDAP. Somewhere in
  the directory, an administrator left a service account's password in plain sight, and a nested
  group grants that account the only path to a protected share. Enumerate the directory, find the
  leaked credential and the path it unlocks, and read the flag from a share you cannot open as
  `s.adeyemi`.

  Point your attack box's resolver at the DC, then:

  1. **Enumerate users and read object attributes (plain LDAP simple bind):**
     `ldapsearch -x -H ldap://{{ machines.dc.addresses.lab }} -D 's.adeyemi@brightwell.lab' -w 'Student!2024' -b 'DC=brightwell,DC=lab' '(objectClass=user)' sAMAccountName description memberOf`
     → notice `svc-moodle`, whose `description` leaks its own password.
  2. **Map the paths (nxc / BloodHound):**
     `nxc ldap {{ machines.dc.addresses.lab }} -u s.adeyemi -p 'Student!2024' --bloodhound --collection All`
     → `svc-moodle` is a member of **IT-Staff**, which is nested inside **Registry-Admins**.
  3. **See what Registry-Admins unlocks:** the `registry` share is restricted to **Registry-Admins**.
  4. **Loot the flag:** `smbclient //dc/registry -U 'BRIGHTWELL\svc-moodle%<leaked>' -c 'get flag.txt'`.

  Submit the contents of `flag.txt`.
