name: Validate lab

# The lab is its isoloom.yml (https://www.isoloom.com): on every PR and push to main the spec
# must be valid, and the Docker edition must come up and pass its checks through the Isothrum
# runner. Generated files under .isoloom/ are build output (regenerated on demand by the launcher
# and in the job below), never committed, so nothing here reads a committed .isoloom/ tree.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isoloom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Isoloom CLI
        run: cargo install isoloom@1.0.1
      - name: Spec is valid
        run: isoloom validate

  # Runs the lab for real (development evidence) through the Isothrum runner: with no flag input it
  # comes up on the inert dev placeholder and must pass its checks, the full solver included.
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Isoloom + Isothrum CLIs
        run: cargo install isoloom@1.0.1 isothrum-cli@1.0.0
      - name: Generate the Docker edition
        run: isoloom generate --target docker
      - name: Up, check, down (Docker)
        run: |
          set -euo pipefail
          isothrum up . --target docker
          isothrum check . --target docker
      - name: Logs
        if: failure()
        run: docker compose -f .isoloom/docker/compose.yml --profile check logs --no-color 2>&1 | tail -500 || true
      - name: Down
        if: always()
        run: isothrum down . --target docker || true
