
# The flag lives here. Only the "Registry-Admins" group (and Domain Admins) may open the share.
# svc-moodle is not a direct member: it reaches Registry-Admins only through the nested group
# "IT-Staff", so the flag is reachable only once LDAP/BloodHound enumeration has revealed both
# svc-moodle's leaked password and the nested group path that grants it access.
[registry]
   path = /srv/registry
   read only = yes
   browseable = yes
   valid users = @"BRIGHTWELL\Registry-Admins", @"BRIGHTWELL\Domain Admins"
