
# The flag lives here. Only the "Vault Readers" group (and Domain Admins) may open the share.
# svc_backup is not a direct member: it reaches Vault Readers only through the nested group
# "IT Backup", so the flag is reachable only once LDAP/BloodHound enumeration has revealed both
# svc_backup's leaked password and the nested group path that grants it access.
[vault]
   path = /srv/vault
   read only = yes
   browseable = yes
   valid users = @"NORTH\Vault Readers", @"NORTH\Domain Admins"
